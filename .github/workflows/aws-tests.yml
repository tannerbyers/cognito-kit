name: AWS integration tests (optional)

on:
  workflow_dispatch:

jobs:
  aws-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Requires real AWS credentials. Only run manually.
    # The stack is deployed temporarily and destroyed afterwards.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real-AWS integration tests
        run: COGNITO_KIT_AWS_TESTS=1 pnpm test:aws
